<title>수원지역부 주간 영업보고서</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#eef2ee;--surface:#fff;--surface-2:#f6f9f6;--ink:#18211c;--muted:#65726b;--line:#dde5df;
  --accent:#1a9c4b;--accent-dark:#15773a;--accent-soft:#e7f4ec;
  --good:#1a9c4b;--good-soft:#e7f4ec;--warn:#c98a08;--warn-soft:#fbf1da;--bad:#d1453f;--bad-soft:#fbe7e6;
  --shadow:0 1px 3px rgba(20,50,30,.08),0 8px 24px rgba(20,50,30,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111713;--surface:#19211c;--surface-2:#141b17;--ink:#e7efe9;--muted:#93a099;--line:#28322c;
  --accent:#39c56f;--accent-dark:#2ba75d;--accent-soft:#16261c;
  --good:#39c56f;--good-soft:#16261c;--warn:#e0b040;--warn-soft:#2a2413;--bad:#e8635d;--bad-soft:#2c1817;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);}}
:root[data-theme="light"]{--bg:#eef2ee;--surface:#fff;--surface-2:#f6f9f6;--ink:#18211c;--muted:#65726b;--line:#dde5df;--accent:#1a9c4b;--accent-dark:#15773a;--accent-soft:#e7f4ec;--good:#1a9c4b;--good-soft:#e7f4ec;--warn:#c98a08;--warn-soft:#fbf1da;--bad:#d1453f;--bad-soft:#fbe7e6;--shadow:0 1px 3px rgba(20,50,30,.08),0 8px 24px rgba(20,50,30,.06);}
:root[data-theme="dark"]{--bg:#111713;--surface:#19211c;--surface-2:#141b17;--ink:#e7efe9;--muted:#93a099;--line:#28322c;--accent:#39c56f;--accent-dark:#2ba75d;--accent-soft:#16261c;--good:#39c56f;--good-soft:#16261c;--warn:#e0b040;--warn-soft:#2a2413;--bad:#e8635d;--bad-soft:#2c1817;--shadow:0 1px 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum";}
.tnum{font-variant-numeric:tabular-nums;}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 60px;}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.brand h1{font-size:21px;font-weight:800;letter-spacing:-.5px;}
.brand .sub{color:var(--muted);font-size:12.5px;margin-top:2px;}
.tools{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
.btn{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:7px 12px;cursor:pointer;transition:.15s;}
.btn:hover{border-color:var(--accent);color:var(--accent-dark);}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
select.btn{font-weight:700;}
/* nav tabs */
.nav{display:flex;gap:4px;flex-wrap:wrap;margin:16px 0 6px;border-bottom:2px solid var(--line);}
.tab{font:inherit;font-size:13.5px;font-weight:700;color:var(--muted);background:none;border:none;cursor:pointer;
  padding:10px 15px;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.15s;white-space:nowrap;}
.tab:hover{color:var(--accent-dark);}
.tab.on{color:var(--accent-dark);border-bottom-color:var(--accent);}
.tab.pending{opacity:.42;}
.tab.pending.on{opacity:1;}
.tab .pend{display:inline-block;margin-left:5px;font-size:9px;font-weight:800;color:#fff;background:var(--warn);border-radius:8px;padding:1px 6px;vertical-align:middle;letter-spacing:.02em;}
.pendbanner{margin:0 0 14px;padding:12px 15px;border-radius:12px;background:var(--warn-soft);border:1px solid var(--warn);color:var(--ink);font-size:13px;font-weight:600;display:flex;gap:9px;align-items:flex-start;line-height:1.5;}
.pendbanner b{color:var(--warn);}
.teamnote{font-size:12px;color:var(--muted);margin:12px 2px 2px;}
.teamnote b{color:var(--accent-dark);}
/* section */
.sec-h{display:flex;align-items:baseline;gap:9px;margin:24px 2px 11px;}
.sec-h .n{font-size:12px;font-weight:800;color:#fff;background:var(--accent-dark);width:22px;height:22px;border-radius:6px;
  display:inline-flex;align-items:center;justify-content:center;flex:none;}
.sec-h h2{font-size:16px;font-weight:800;letter-spacing:-.3px;}
.sec-h h3{font-size:14px;font-weight:800;}
.sec-h .hint{font-size:12px;color:var(--muted);margin-left:auto;}
/* KPI */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px 12px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--st,var(--accent));}
.kpi .kh{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.kpi .knm{font-size:12.5px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap;}
.rank{font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted);white-space:nowrap;}
.rank.good{background:var(--good-soft);color:var(--good);}.rank.warn{background:var(--warn-soft);color:var(--warn);}.rank.bad{background:var(--bad-soft);color:var(--bad);}
.stat{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap;}
.stat.good{background:var(--good-soft);color:var(--good);}.stat.warn{background:var(--warn-soft);color:var(--warn);}.stat.bad{background:var(--bad-soft);color:var(--bad);}
.kpi .val{font-size:25px;font-weight:800;letter-spacing:-.5px;margin:7px 0 1px;line-height:1;}
.kpi .val small{font-size:12px;font-weight:700;color:var(--muted);margin-left:2px;}
.kpi .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;margin-top:5px;}
.gchip{color:var(--muted);font-weight:600;}.gchip b{color:var(--ink);font-weight:800;}
.mchip{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);}
.mchip b{font-weight:800;}
.mchip.good{background:var(--good-soft);color:var(--good);}.mchip.warn{background:var(--warn-soft);color:var(--warn);}.mchip.bad{background:var(--bad-soft);color:var(--bad);}
.spark{margin-top:9px;}.spark svg{display:block;width:100%;height:32px;}
.spark .lab{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);margin-top:2px;}
/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:4px;}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 15px;box-shadow:var(--shadow);border-left:4px solid var(--tc,var(--accent));}
.tile .v{font-size:23px;font-weight:800;letter-spacing:-.5px;color:var(--tc,var(--ink));}
.tile .v small{font-size:12px;color:var(--muted);font-weight:700;}
.tile .l{font-size:11.5px;color:var(--muted);margin-top:3px;}
/* table */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;}
.tblscroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;}
thead th{background:var(--surface-2);font-weight:700;color:var(--muted);font-size:11.5px;}
tbody td:first-child,tbody th:first-child{text-align:left;font-weight:700;background:var(--surface-2);}
tbody tr:hover td{background:var(--accent-soft);}
tr.sum td,tr.sum th{background:var(--accent-soft);font-weight:800;color:var(--accent-dark);}
tr.sum:hover td{background:var(--accent-soft);}
tr.hl-row td,tr.hl-row th:first-child{background:var(--warn-soft)!important;box-shadow:inset 0 0 0 1.5px var(--warn);}
tr.click{cursor:pointer;}
.g{color:var(--good);font-weight:700;}.w{color:var(--warn);font-weight:700;}.b{color:var(--bad);font-weight:700;}
td.itemcell{white-space:normal;text-align:left;font-size:11px;color:var(--muted);min-width:180px;max-width:280px;line-height:1.4;}
/* insight card */
.insight{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;
  padding:13px 16px;box-shadow:var(--shadow);margin-top:12px;}
.insight .t{font-weight:800;color:var(--accent-dark);font-size:13px;margin-bottom:5px;}
.insight ul{margin:0 0 0 17px;font-size:12.5px;line-height:1.65;}
.insight li{margin:2px 0;}
.insight b{font-weight:800;}
.note{font-size:11px;color:var(--muted);margin:9px 2px 0;line-height:1.5;}
/* 경영계획 현황 (최상단) */
.mgmt{background:linear-gradient(135deg,var(--accent-dark),var(--accent));border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;margin:6px 0 12px;color:#fff;}
.mg-h{font-size:16px;font-weight:800;margin-bottom:11px;display:flex;align-items:baseline;gap:9px;}
.mg-h span{font-size:11.5px;font-weight:600;opacity:.85;}
.mg-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:560px){.mg-grid{grid-template-columns:1fr;}}
.mg-card{background:rgba(255,255,255,.14);border-radius:12px;padding:11px 14px;}
.mg-l{font-size:12px;font-weight:700;opacity:.9;}
.mg-v{font-size:27px;font-weight:800;letter-spacing:-.5px;line-height:1.1;margin:2px 0 6px;}
.mg-v small{font-size:12px;font-weight:700;opacity:.8;margin-left:4px;}
.mg-sub{display:flex;gap:6px;flex-wrap:wrap;}
.mg-sub .mchip{background:rgba(255,255,255,.9);}
.mg-sub .mchip.good{color:var(--accent-dark);}
.mg-sub .mchip.warn{color:#b06a00;}
.mg-sub .mchip.bad{color:#c0392b;}
.mg-reason{font-size:12px;line-height:1.55;margin-top:11px;background:rgba(0,0,0,.16);border-radius:10px;padding:9px 12px;}
.mg-reason b{font-weight:800;}
/* 이번 주 요약 */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;margin:6px 0 14px;border-top:4px solid var(--accent);}
.sm-h{font-size:16px;font-weight:800;color:var(--accent-dark);margin-bottom:11px;display:flex;align-items:baseline;gap:9px;}
.sm-h span{font-size:11.5px;font-weight:600;color:var(--muted);}
.sm-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:680px){.sm-cols{grid-template-columns:1fr;}}
.sm-col{border-radius:12px;padding:11px 14px;}
.sm-col.good{background:var(--good-soft);}
.sm-col.warn{background:var(--warn-soft);}
.sm-t{font-size:12.5px;font-weight:800;margin-bottom:6px;}
.sm-col.good .sm-t{color:var(--good);}
.sm-col.warn .sm-t{color:var(--warn);}
.sm-col ul{margin:0 0 0 16px;font-size:12px;line-height:1.55;}
.sm-col li{margin:4px 0;}
.sm-col b{font-weight:800;}
.sm-note{font-size:10.5px;color:var(--muted);margin-top:9px;}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:13px;padding:26px;text-align:center;color:var(--muted);font-size:13px;box-shadow:var(--shadow);}
.page{display:none;}.page.on{display:block;}
.foot{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}
@media print{.tools,.nav{display:none!important;}.page{display:block!important;}.kpi,.panel,.tile,.insight{box-shadow:none;}.wrap{max-width:none;padding:0;}}
@media (max-width:560px){.brand h1{font-size:18px;}.kpi .val{font-size:22px;}}
</style>

/* ===== helpers ===== */
function fmt(n){ if(n==null||n==="")return"—"; return typeof n==="number"?n.toLocaleString("ko-KR",{maximumFractionDigits:1}):n; }
function clsDir(v,dir){ if(v==null)return""; return dir>0?(v>=100?"good":v>=95?"warn":"bad"):(v<=100?"good":v<=105?"warn":"bad"); }
function yc(v,dir){ dir=dir||1; return v==null?"":(dir>0?(v>=100?"g":v>=95?"w":"b"):(v<=100?"g":v<=105?"w":"b")); }
const STC={good:"var(--good)",warn:"var(--warn)",bad:"var(--bad)"};
function sparkBars(weeks,cls){
  if(!weeks||!weeks.length)return"";
  const v=weeks.map(w=>w[1]),mn=Math.min(...v),mx=Math.max(...v),rg=(mx-mn)||1,n=v.length,gap=6,w=100/n;
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">`+
    v.map((x,i)=>{const h=20+(x-mn)/rg*74,last=i===n-1;
      return `<rect x="${i*w+gap/2}%" y="${100-h}%" width="${w-gap}%" height="${h}%" rx="2" fill="${last?STC[cls]:'var(--line)'}"></rect>`;}).join("")+`</svg>`;
}
function tile(v,unit,label,cls){ return `<div class="tile" style="--tc:${cls?`var(--${cls})`:'var(--accent)'}"><div class="v tnum">${v}${unit?`<small>${unit}</small>`:""}</div><div class="l">${label}</div></div>`; }
function pctCell(v,dir){ return v==null?`<td class="tnum">—</td>`:`<td class="tnum ${yc(v,dir)}">${v}%</td>`; }

/* ===== 1장: 대시보드 ===== */
function kpiCard(k){
  const dir=k.dir||1, m0=k.m[k.pr||0], cls=clsDir(m0[1],dir);
  const latest=k.weeks[k.weeks.length-1];
  const goal=k.goal!=null?`<span class="gchip tnum">${k.goalLabel||"목표"} <b>${fmt(k.goal)}</b></span>`:"";
  const chips=k.m.map(x=>`<span class="mchip ${clsDir(x[1],dir)} tnum">${x[0]} <b>${x[1]}%</b></span>`).join("");
  const of=KPI.meta.regions, rp=k.rank==null?"":`<span class="rank ${k.rank<=Math.ceil(of/3)?'good':k.rank<=Math.ceil(of*2/3)?'warn':'bad'}">전사 ${k.rankEst?"≈":""}${k.rank}위</span>`;
  return `<div class="kpi" style="--st:${STC[cls]}"><div class="kh"><span class="knm">${k.name}${rp}</span>
    <span class="stat ${cls}">${m0[0]} ${m0[1]}%</span></div>
    <div class="val tnum">${fmt(latest[1])}<small>${k.unit}</small></div>
    <div class="meta">${goal}${chips}</div>
    <div class="spark">${sparkBars(k.weeks,cls)}<div class="lab"><span>${k.weeks[0][0]}</span><span>${latest[0]}</span></div></div></div>`;
}
function renderSummary(){
  const good=[],warn=[];
  KPI.list.forEach(k=>{ const m=k.m[k.pr||0],dir=k.dir||1,cls=clsDir(m[1],dir);
    if(cls==="bad") warn.push(`${k.name} <b>${m[0]} ${m[1]}%</b>`);
    else if(dir>0&&m[1]>=110) good.push(`${k.name} <b>${m[0]} ${m[1]}%</b>`); });
  const E=REPORT.lasimEff,ri=REPORT.rice.region,rin=REPORT.rice_non.region,sa=REPORT.sand.region,san=REPORT.sand_non.region,dd=REPORT.dodu.region,ex=REPORT.ext.region;
  const rgap=Math.round((ri.yoy-rin.yoy)*10)/10, sgap=Math.round((sa.yoy-san.yoy)*10)/10;
  const wins=[
    `☕ <b>라심발리 교체 효과 확실</b> — 도입점 잔수 전년비 ${E.treat.cups_yoy}% vs 미도입 ${E.ctrl.cups_yoy}%, 순효과 <b class="g">+${E.did_cups}%p</b> (평균 ${E.treat.cups_2507}→${E.treat.cups_2607}잔)`,
    `🍙 <b>헬시플레저 행사 효과</b> — 진행 ${sa.yoy}% vs 미진행 ${san.yoy}%, 초과분 <b class="g">+${sgap}%p</b>`,
    `🏪 <b>점두진열</b> 상품매출 전년비 <b class="g">${dd.dy}%(2.1배)</b>, 동일점 ${dd.incRate}% 성장`,
    `📦 <b>연장진열대</b> 일매출 전년비 ${ex.sy}% (9팀 ${REPORT.ext.teams['9팀'].sy}%·재고 ${REPORT.ext.teams['9팀'].ry}% 최고)`,
  ].concat(good.slice(0,2).map(g=>`📈 ${g}`));
  const risks=[
    `🍙 <b>주먹밥 행사 재점검</b> — 진행 ${ri.yoy}% < 미진행 ${rin.yoy}% (초과분 <b class="b">${rgap}%p</b>) → 고매출 성숙점 위주라 저성장점 재배치 검토`,
  ].concat(warn.map(w=>`⚠️ ${w} — 목표/전년 미달`));
  return `<div class="summary">
    <div class="sm-h">📋 ${KPI.meta.week} 핵심 요약 <span>${KPI.meta.asof} · 자동 추출</span></div>
    <div class="sm-cols">
      <div class="sm-col good"><div class="sm-t">✅ 성과 (효과 확인)</div><ul>${wins.map(x=>`<li>${x}</li>`).join("")}</ul></div>
      <div class="sm-col warn"><div class="sm-t">⚠️ 점검 필요</div><ul>${risks.map(x=>`<li>${x}</li>`).join("")}</ul></div>
    </div>
    <div class="sm-note">※ 지표 목표/전년 대비와 진행 vs 미진행·DiD 결과에서 자동 선별했습니다.</div></div>`;
}
function mgmtCard(label,d){
  let chips = d.yoy==null ? `<span class="mchip tnum" style="background:rgba(255,255,255,.85);color:#555">경영계획 달성률</span>` : `<span class="mchip tnum" style="background:rgba(255,255,255,.85);color:${d.yoy>=100?'#127a3e':'#b45309'}">전년비 ${d.yoy}% ${d.yoy>=100?'▲':'▼'}</span>`;
  if(d.target!=null){
    const gap=Math.round((d.yoy-d.target)*10)/10;
    chips += `<span class="mchip ${gap>=0?'good':'warn'} tnum">지역부목표 ${d.target}% ${gap>=0?'▲':'▼'}${Math.abs(gap)}%p</span>`;
  }
  return `<div class="mg-card">
    <div class="mg-l">${label} <b style="opacity:.85">경영비</b></div>
    <div class="mg-v tnum">${d.plan}%<small>경영계획 대비</small></div>
    <div class="mg-sub">${chips}</div></div>`;
}

/* ===== 공통: 팀 요약표 + 점포표 빌더 ===== */
function teamRows(obj, cols){
  // cols: [{h, get(td), cls(td)}], td=team data
  let h=`<thead><tr><th>팀</th>${cols.map(c=>`<th>${c.h}</th>`).join("")}</tr></thead><tbody>`;
  const R=obj.region;
  h+=`<tr class="sum"><th>수원지역부</th>${cols.map(c=>`<td>${c.reg?c.reg(R):(c.get?c.get(R):"")}</td>`).join("")}</tr>`;
  TEAMS.forEach(t=>{
    const td=obj.teams[t]; if(!td)return;
    const hl=(t===selTeam)?' class="hl-row click"':' class="click"';
    h+=`<tr${hl} data-team="${t}"><th>수원${t}</th>${cols.map(c=>c.get(td)).join("")}</tr>`;
  });
  return h+"</tbody>";
}

function topN(teams,key,n){ return Object.entries(teams).filter(([,v])=>v[key]!=null).sort((a,b)=>b[1][key]-a[1][key]).slice(0,n).map(([t,v])=>`<b>수원${t}</b> ${v[key]}%`).join(" · "); }
function botN(teams,key,n){ return Object.entries(teams).filter(([,v])=>v[key]!=null).sort((a,b)=>a[1][key]-b[1][key]).slice(0,n).map(([t,v])=>`<b>수원${t}</b> ${v[key]}%`).join(" · "); }

/* 점포별 월별 잔수 미니 스파크라인 (도입월 표시) */
function monthSpark(series,di){
  const vv=(series||[]).filter(v=>v!=null); if(!vv.length) return `<span style="color:var(--muted)">데이터 없음</span>`;
  const mn=Math.min(...vv), mx=Math.max(...vv), rg=(mx-mn)||1;
  const n=series.length, W=170,H=32,pad=4;
  const X=i=>pad+(W-2*pad)*(i/(n-1)), Y=v=>pad+(H-2*pad)*(1-(v-mn)/rg);
  let g="";
  if(di!=null) g+=`<line x1="${X(di).toFixed(1)}" y1="0" x2="${X(di).toFixed(1)}" y2="${H}" stroke="var(--warn)" stroke-width="1.2" stroke-dasharray="2 2"/>`;
  const pts=series.map((v,i)=>v==null?null:`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).filter(Boolean).join(" ");
  g+=`<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linejoin="round"/>`;
  const li=series.length-1; if(series[li]!=null) g+=`<circle cx="${X(li).toFixed(1)}" cy="${Y(series[li]).toFixed(1)}" r="2.6" fill="var(--accent)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="vertical-align:middle" role="img"><title>월별 판매잔수 (도입월 점선)</title>${g}</svg>`;
}
/* ===== 라심발리 교체 효과 (도입점 vs 미도입 DiD) ===== */
function lineChart(series,labels){
  const all=series.flatMap(s=>s.data).filter(v=>v!=null);
  const mn=Math.floor(Math.min(...all)), mx=Math.ceil(Math.max(...all)), rg=(mx-mn)||1;
  const W=720,H=210,pL=30,pB=30,pT=12,pR=12,n=labels.length;
  const X=i=>pL+(W-pL-pR)*(i/(n-1)), Y=v=>pT+(H-pT-pB)*(1-(v-mn)/rg);
  let g="";
  for(let k=0;k<=3;k++){const v=mn+rg*k/3,yy=Y(v);g+=`<line x1="${pL}" y1="${yy}" x2="${W-pR}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${pL-5}" y="${yy+3}" font-size="9" fill="var(--muted)" text-anchor="end">${v.toFixed(1)}</text>`;}
  labels.forEach((l,i)=>{ if(i%2===0||i===n-1) g+=`<text x="${X(i)}" y="${H-pB+14}" font-size="8" fill="var(--muted)" text-anchor="middle">${l}</text>`; });
  series.forEach(s=>{
    const pts=s.data.map((v,i)=>v==null?null:`${X(i)},${Y(v)}`).filter(Boolean).join(" ");
    g+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
    s.data.forEach((v,i)=>{ if(v!=null&&i===s.data.length-1) g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="${s.color}"/><text x="${X(i)-6}" y="${Y(v)-6}" font-size="10" font-weight="800" fill="${s.color}" text-anchor="end">${v}</text>`; });
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img">${g}</svg>`;
}

  }

  html+=insight("도너츠 마스터 정리 해석",[
    `미운영 마스터 점검 대상 <b>${D.target}점</b> 중 <b class="b">${D.del}점 삭제</b>, <b class="w">${D.keep}점은 유지요청</b>(차주 內 운영예정) → 마스터 275→198(△${dMaster}), 개선대상점 <b class="b">144→61(△83)</b>으로 대폭 감소.`,
    `운영점 일매출은 <b>${B.daily.toLocaleString()}→${A.daily.toLocaleString()}원</b>으로 유지, 전년비 <b class="g">${B.yoy}→${A.yoy}%(+${dYoy}%p)</b> — 미운영점 제거로 지표 왜곡 해소.`,
    `➡ 유지요청 <b>${D.keep}점</b>(1·2·3·5·6팀)은 차주 내 실제 운영 개시 여부 확인 필요. 본 분석은 <b>1회성</b>으로 차주부터 미표기.`,
  ]);
  return html;
}
/* ===== 렌더 라우터 ===== */
function renderPage(){
  document.querySelectorAll(".page").forEach((p,i)=>p.classList.toggle("on",i===curPage));
  document.querySelectorAll(".tab").forEach((t,i)=>t.classList.toggle("on",i===curPage));
  const el=document.getElementById("page-"+curPage);
  if(curPage===0) el.innerHTML=renderDash();
  else if(curPage===1) el.innerHTML=renderExt();
  else if(curPage===2) el.innerHTML=renderDodu();
  else if(curPage===3) el.innerHTML=renderConv();
  else if(curPage===4) el.innerHTML=renderCoffee();
  else if(curPage===5) el.innerHTML=renderStrat(STRAT.bh405,"BH405 (베이커리 5종)",11,69.9,"08.17 재고 기준");
  else if(curPage===6) el.innerHTML=renderStrat(STRAT.ddcan,"뚱캔 (중용량 탄산캔 5종)",3,92.2,"08.17 재고 기준");
  else if(curPage===7) el.innerHTML=renderSangjo();
  else if(curPage===8) el.innerHTML=renderDelDonut();
  if(PENDING.includes(curPage)) el.innerHTML=`<div class="pendbanner">🚧 <div><b>8월 데이터 취합 미완료</b> — 권역 사진 취합이 진행 중입니다. 아래 수치는 <b>7월 기준 참고 자료</b>이며, 8월 확정치는 취합 완료 후 갱신됩니다.</div></div>`+el.innerHTML;
  // 팀 안내
  const tn=document.getElementById("teamnote");
  if(curPage===0){ tn.innerHTML=""; }
  else if(selTeam){ tn.innerHTML=`🔎 <b>수원${selTeam}</b> 선택됨 — 팀 기준으로 표시 중. (표 행 클릭으로도 팀 전환)`; }
  else { tn.innerHTML=`💡 상단 <b>팀별 조회</b>에서 팀을 고르거나, 표의 팀 행을 클릭하면 해당 팀 점포까지 펼쳐집니다.`; }
  // 행 클릭 → 팀 선택 또는 코호트 펼침
  el.querySelectorAll(".sjbtn").forEach(b=>b.onclick=()=>{selSangjo=b.dataset.p; renderPage();});
  el.querySelectorAll("tr.click").forEach(tr=>tr.onclick=()=>{
    if(tr.dataset.cohort){ selCohort=(selCohort===tr.dataset.cohort)?null:tr.dataset.cohort; }
    else { selTeam=(selTeam===tr.dataset.team)?null:tr.dataset.team; syncSelect(); }
    renderPage();
  });
}
function insight(t,lines){ return `<div class="insight"><div class="t">💬 ${t}</div><ul>${lines.map(l=>`<li>${l}</li>`).join("")}</ul></div>`; }

/* ===== nav / controls ===== */
function buildNav(){
  document.getElementById("nav").innerHTML=PAGES.map((p,i)=>`<button class="tab${PENDING.includes(i)?" pending":""}" data-i="${i}">${p[0]} ${p[1]}${PENDING.includes(i)?`<span class="pend">취합중</span>`:""}</button>`).join("");
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{curPage=+t.dataset.i;renderPage();window.scrollTo({top:0,behavior:"smooth"});});
  const sel=document.getElementById("team-select");
  sel.innerHTML=`<option value="">👥 전체 (지역부)</option>`+TEAMS.map(t=>`<option value="${t}">수원${t}</option>`).join("");
  sel.onchange=e=>{selTeam=e.target.value||null;renderPage();};
}
function syncSelect(){ document.getElementById("team-select").value=selTeam||""; }
buildNav(); renderPage();

document.getElementById("btn-print").onclick=()=>window.print();
document.getElementById("btn-theme").onclick=()=>{const c=document.documentElement.getAttribute("data-theme");const d=c?c==="dark":matchMedia("(prefers-color-scheme:dark)").matches;document.documentElement.setAttribute("data-theme",d?"light":"dark");};
document.getElementById("btn-download").onclick=()=>{
  const clone=document.documentElement.cloneNode(true);
  const html="<!DOCTYPE html>\n<html lang=\"ko\">"+clone.innerHTML+"</html>";
  const b=new Blob([html],{type:"text/html;charset=utf-8"});const a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download="수원지역부_영업보고서_7월3주.html";a.click();URL.revokeObjectURL(a.href);
};
