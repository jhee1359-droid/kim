<title>수원지역부 주간 영업보고서</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>

}
@media (prefers-color-scheme:dark){:root{
  --bg:#111713;--surface:#19211c;--surface-2:#141b17;--ink:#e7efe9;--muted:#93a099;--line:#28322c;
  --accent:#39c56f;--accent-dark:#2ba75d;--accent-soft:#16261c;
  --good:#39c56f;--good-soft:#16261c;--warn:#e0b040;--warn-soft:#2a2413;--bad:#e8635d;--bad-soft:#2c1817;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);}}
:root[data-theme="light"]{--bg:#eef2ee;--surface:#fff;--surface-2:#f6f9f6;--ink:#18211c;--muted:#65726b;--line:#dde5df;--accent:#1a9c4b;--accent-dark:#15773a;--accent-soft:#e7f4ec;--good:#1a9c4b;--good-soft:#e7f4ec;--warn:#c98a08;--warn-soft:#fbf1da;--bad:#d1453f;--bad-soft:#fbe7e6;--shadow:0 1px 3px rgba(20,50,30,.08),0 8px 24px rgba(20,50,30,.06);}
:root[data-theme="dark"]{--bg:#111713;--surface:#19211c;--surface-2:#141b17;--ink:#e7efe9;--muted:#93a099;--line:#28322c;--accent:#39c56f;--accent-dark:#2ba75d;--accent-soft:#16261c;--good:#39c56f;--good-soft:#16261c;--warn:#e0b040;--warn-soft:#2a2413;--bad:#e8635d;--bad-soft:#2c1817;--shadow:0 1px 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum";}
.tnum{font-variant-numeric:tabular-nums;}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 60px;}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.brand h1{font-size:21px;font-weight:800;letter-spacing:-.5px;}
.brand .sub{color:var(--muted);font-size:12.5px;margin-top:2px;}
.tools{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
.btn{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:7px 12px;cursor:pointer;transition:.15s;}
.btn:hover{border-color:var(--accent);color:var(--accent-dark);}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
select.btn{font-weight:700;}
/* nav tabs */
.nav{display:flex;gap:4px;flex-wrap:wrap;margin:16px 0 6px;border-bottom:2px solid var(--line);}
.tab{font:inherit;font-size:13.5px;font-weight:700;color:var(--muted);background:none;border:none;cursor:pointer;
  padding:10px 15px;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.15s;white-space:nowrap;}
.tab:hover{color:var(--accent-dark);}
.tab.on{color:var(--accent-dark);border-bottom-color:var(--accent);}
.teamnote{font-size:12px;color:var(--muted);margin:12px 2px 2px;}
.teamnote b{color:var(--accent-dark);}
/* section */
.sec-h{display:flex;align-items:baseline;gap:9px;margin:24px 2px 11px;}
.sec-h .n{font-size:12px;font-weight:800;color:#fff;background:var(--accent-dark);width:22px;height:22px;border-radius:6px;
  display:inline-flex;align-items:center;justify-content:center;flex:none;}
.sec-h h2{font-size:16px;font-weight:800;letter-spacing:-.3px;}
.sec-h h3{font-size:14px;font-weight:800;}
.sec-h .hint{font-size:12px;color:var(--muted);margin-left:auto;}
/* KPI */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px 12px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--st,var(--accent));}
.kpi .kh{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.kpi .knm{font-size:12.5px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap;}
.rank{font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted);white-space:nowrap;}
.rank.good{background:var(--good-soft);color:var(--good);}.rank.warn{background:var(--warn-soft);color:var(--warn);}.rank.bad{background:var(--bad-soft);color:var(--bad);}
.stat{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap;}
.stat.good{background:var(--good-soft);color:var(--good);}.stat.warn{background:var(--warn-soft);color:var(--warn);}.stat.bad{background:var(--bad-soft);color:var(--bad);}
.kpi .val{font-size:25px;font-weight:800;letter-spacing:-.5px;margin:7px 0 1px;line-height:1;}
.kpi .val small{font-size:12px;font-weight:700;color:var(--muted);margin-left:2px;}
.kpi .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;margin-top:5px;}
.gchip{color:var(--muted);font-weight:600;}.gchip b{color:var(--ink);font-weight:800;}
.mchip{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);}
.mchip b{font-weight:800;}
.mchip.good{background:var(--good-soft);color:var(--good);}.mchip.warn{background:var(--warn-soft);color:var(--warn);}.mchip.bad{background:var(--bad-soft);color:var(--bad);}
.spark{margin-top:9px;}.spark svg{display:block;width:100%;height:32px;}
.spark .lab{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);margin-top:2px;}
/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:4px;}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 15px;box-shadow:var(--shadow);border-left:4px solid var(--tc,var(--accent));}
.tile .v{font-size:23px;font-weight:800;letter-spacing:-.5px;color:var(--tc,var(--ink));}
.tile .v small{font-size:12px;color:var(--muted);font-weight:700;}
.tile .l{font-size:11.5px;color:var(--muted);margin-top:3px;}
/* table */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;}
.tblscroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;}
thead th{background:var(--surface-2);font-weight:700;color:var(--muted);font-size:11.5px;}
tbody td:first-child,tbody th:first-child{text-align:left;font-weight:700;background:var(--surface-2);}
tbody tr:hover td{background:var(--accent-soft);}
tr.sum td,tr.sum th{background:var(--accent-soft);font-weight:800;color:var(--accent-dark);}
tr.sum:hover td{background:var(--accent-soft);}
tr.hl-row td,tr.hl-row th:first-child{background:var(--warn-soft)!important;box-shadow:inset 0 0 0 1.5px var(--warn);}
tr.click{cursor:pointer;}
.g{color:var(--good);font-weight:700;}.w{color:var(--warn);font-weight:700;}.b{color:var(--bad);font-weight:700;}
/* insight card */
.insight{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;
  padding:13px 16px;box-shadow:var(--shadow);margin-top:12px;}
.insight .t{font-weight:800;color:var(--accent-dark);font-size:13px;margin-bottom:5px;}
.insight ul{margin:0 0 0 17px;font-size:12.5px;line-height:1.65;}
.insight li{margin:2px 0;}
.insight b{font-weight:800;}
.note{font-size:11px;color:var(--muted);margin:9px 2px 0;line-height:1.5;}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:13px;padding:26px;text-align:center;color:var(--muted);font-size:13px;box-shadow:var(--shadow);}
.page{display:none;}.page.on{display:block;}
.foot{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}
@media print{.tools,.nav{display:none!important;}.page{display:block!important;}.kpi,.panel,.tile,.insight{box-shadow:none;}.wrap{max-width:none;padding:0;}}
@media (max-width:560px){.brand h1{font-size:18px;}.kpi .val{font-size:22px;}}
</style>

/* ===== 공통: 팀 요약표 + 점포표 빌더 ===== */
function teamRows(obj, cols){
  // cols: [{h, get(td), cls(td)}], td=team data
  let h=`<thead><tr><th>팀</th>${cols.map(c=>`<th>${c.h}</th>`).join("")}</tr></thead><tbody>`;
  const R=obj.region;
  h+=`<tr class="sum"><th>수원지역부</th>${cols.map(c=>`<td>${c.reg?c.reg(R):(c.get?c.get(R):"")}</td>`).join("")}</tr>`;
  TEAMS.forEach(t=>{
    const td=obj.teams[t]; if(!td)return;
    const hl=(t===selTeam)?' class="hl-row click"':' class="click"';
    h+=`<tr${hl} data-team="${t}"><th>수원${t}</th>${cols.map(c=>c.get(td)).join("")}</tr>`;
  });
  return h+"</tbody>";
}

function convBlock(obj,title,n,nonR){

  if(nonR){
    const gap=Math.round((R.yoy-nonR.yoy)*10)/10;
    tiles+=`${tile(nonR.yoy,"%","미진행점 전년비(비교군)",null)}${tile((gap>=0?"+":"")+gap,"%p","초과분(진행−미진행)",gap>=0?"good":"bad")}`;

  html+=`<div class="tiles">${tiles}</div>`;

    {h:"전년비",get:t=>pctCell(t.yoy,1),reg:r=>`<span class="${yc(r.yoy,1)}">${r.yoy}%</span>`},
    {h:"전월비",get:t=>pctCell(t.mom,1),reg:r=>`<span class="${yc(r.mom,1)}">${r.mom}%</span>`},

    html+=`<div class="panel"><div class="tblscroll"><table><thead><tr><th>점포</th><th>일 발주</th><th>26.07 일매출</th><th>전년비</th><th>전월비</th></tr></thead><tbody>`+

  h+=`<tr class="sum"><th>수원지역부</th>${cols.map(c=>`<td>${c.r}</td>`).join("")}</tr>`;
  TEAMS.forEach(t=>{const td=obj.teams[t];if(!td||td.target==null)return;
    const hl=(t===selTeam)?' class="hl-row click"':' class="click"';
    h+=`<tr${hl} data-team="${t}"><th>수원${t}</th>${cols.map(c=>`<td class="tnum">${c.g(td)}</td>`).join("")}</tr>`;});
  return h+"</tbody>";
}

/* ===== 렌더 라우터 ===== */
function renderPage(){
  document.querySelectorAll(".page").forEach((p,i)=>p.classList.toggle("on",i===curPage));
  document.querySelectorAll(".tab").forEach((t,i)=>t.classList.toggle("on",i===curPage));
  const el=document.getElementById("page-"+curPage);
  if(curPage===0) el.innerHTML=renderDash();
  else if(curPage===1) el.innerHTML=renderExt();
  else if(curPage===2) el.innerHTML=renderDodu();
  else if(curPage===3) el.innerHTML=renderConv();
  else if(curPage===4) el.innerHTML=renderCoffee();
  // 팀 안내
  const tn=document.getElementById("teamnote");
  if(curPage===0){ tn.innerHTML=""; }
  else if(selTeam){ tn.innerHTML=`🔎 <b>수원${selTeam}</b> 선택됨 — 팀 기준으로 표시 중. (표 행 클릭으로도 팀 전환)`; }
  else { tn.innerHTML=`💡 상단 <b>팀별 조회</b>에서 팀을 고르거나, 표의 팀 행을 클릭하면 해당 팀 점포까지 펼쳐집니다.`; }
  // 행 클릭 → 팀 선택
  el.querySelectorAll("tr.click").forEach(tr=>tr.onclick=()=>{ selTeam=(selTeam===tr.dataset.team)?null:tr.dataset.team; syncSelect(); renderPage(); });
}
function insight(t,lines){ return `<div class="insight"><div class="t">💬 ${t}</div><ul>${lines.map(l=>`<li>${l}</li>`).join("")}</ul></div>`; }

/* ===== nav / controls ===== */
function buildNav(){
  document.getElementById("nav").innerHTML=PAGES.map((p,i)=>`<button class="tab" data-i="${i}">${p[0]} ${p[1]}</button>`).join("");
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{curPage=+t.dataset.i;renderPage();window.scrollTo({top:0,behavior:"smooth"});});
  const sel=document.getElementById("team-select");
  sel.innerHTML=`<option value="">👥 전체 (지역부)</option>`+TEAMS.map(t=>`<option value="${t}">수원${t}</option>`).join("");
  sel.onchange=e=>{selTeam=e.target.value||null;renderPage();};
}
function syncSelect(){ document.getElementById("team-select").value=selTeam||""; }
buildNav(); renderPage();

document.getElementById("btn-print").onclick=()=>window.print();
document.getElementById("btn-theme").onclick=()=>{const c=document.documentElement.getAttribute("data-theme");const d=c?c==="dark":matchMedia("(prefers-color-scheme:dark)").matches;document.documentElement.setAttribute("data-theme",d?"light":"dark");};
document.getElementById("btn-download").onclick=()=>{
  const clone=document.documentElement.cloneNode(true);
  const html="<!DOCTYPE html>\n<html lang=\"ko\">"+clone.innerHTML+"</html>";
  const b=new Blob([html],{type:"text/html;charset=utf-8"});const a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download="수원지역부_영업보고서_7월3주.html";a.click();URL.revokeObjectURL(a.href);
};
</script>
